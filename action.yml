name: "AI PR Review"
description: "Reviews pull request diffs with Groq (openai/gpt-oss-120b) across bug, security, test-coverage, and style passes, then posts a structured summary comment."
author: "Hiba Iqbal Begum"

inputs:
  groq-api-key:
    description: "Groq API key"
    required: true
  github-token:
    description: "Token used to read the PR diff and post the review comment"
    required: false
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install dependencies
      shell: bash
      run: pip install -r ${{ github.action_path }}/requirements.txt

    - name: Run review
      shell: bash
      working-directory: ${{github.action_path}}
      env:
        GROQ_API_KEY: ${{ inputs.groq-api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_EVENT_PATH: ${{ github.event_path }}
      run: python -m src.main
